name: Magic Circle Studio
description: >-
  Magic Circle Studio is a venture-backed consumer mobile game developer building
  social games designed to nourish relationships through cooperation, creativity, and
  playful shared experiences. Its flagship title, Magic Garden, launched on iOS in
  July 2025 and reached one million players in its first year, following the studio's
  earlier titles Truffle Hogs and a Magic Circle Discord activity that won Discord's
  Best Chill/Party Game award. The studio received pre-seed funding from General
  Catalyst in 2022 and joined the a16z Games SPEEDRUN accelerator in 2023. It is a
  direct-to-consumer game company with no public developer platform, API, SDK, or
  documentation surface; this profile is maintained as a network identity record.
